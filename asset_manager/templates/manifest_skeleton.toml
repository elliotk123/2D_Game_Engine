# manifest.toml
# Root asset manifest for the game/project.
# This file points to one or more asset definition files and/or
# contains inline asset definitions.
#
# Paths in this file are recommended to be relative to this file's location.

version = 1

# Optional: reference one or more external asset definition files (loaded in order)
